server {
    listen 80;
    server_name localhost;

    # Root directory where compiled React static files reside
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for faster loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # React Single Page Application (SPA) routing
    # If the requested URI doesn't exist as a physical file, redirect to /index.html
    # This prevents 404 errors when refreshing routes like /recommendations, /login, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (images, css, js) for 30 days
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
