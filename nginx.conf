server {
    listen 80;
    server_name localhost;

    # Root directory where compiled React static files reside
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for faster loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Same-origin Reverse Proxy for Flask Backend API (/api/<endpoint> -> http://backend-service:5000/<endpoint>)
    # Static proxy_pass uses OS libc/musl resolver which applies Kubernetes search domains (.default.svc.cluster.local)
    # and Docker Compose network aliases seamlessly without needing explicit resolver overrides.
    location ^~ /api/ {
        proxy_pass http://backend-service:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # React Single Page Application (SPA) routing
    # If the requested URI doesn't exist as a physical file, redirect to /index.html
    # This prevents 404 errors when refreshing routes like /recommendations, /login, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (images, css, js) for 30 days
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
