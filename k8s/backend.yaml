# =============================================================================
# Flask Backend Deployment & ClusterIP Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: insightsphere-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insightsphere-backend
  template:
    metadata:
      labels:
        app: insightsphere-backend
    spec:
      containers:
        - name: backend
          image: social_media_analysis-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: insightsphere-secrets
                  key: YOUTUBE_API_KEY
                  optional: true
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017/network"
            - name: MONGODB_DB
              value: "network"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: insightsphere-secrets
                  key: JWT_SECRET_KEY
                  optional: true
            - name: FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: insightsphere-secrets
                  key: FROM_EMAIL
                  optional: true
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insightsphere-secrets
                  key: EMAIL_PASSWORD
                  optional: true
            - name: MAIL_SERVER
              value: "smtp.gmail.com"
            - name: MAIL_PORT
              value: "587"
            - name: MAIL_USE_TLS
              value: "True"
          livenessProbe:
            httpGet:
              path: /ping
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: insightsphere-backend
spec:
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
  selector:
    app: insightsphere-backend
