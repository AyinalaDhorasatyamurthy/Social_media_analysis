# =============================================================================
# React Frontend Deployment & NodePort / LoadBalancer Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: insightsphere-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insightsphere-frontend
  template:
    metadata:
      labels:
        app: insightsphere-frontend
    spec:
      containers:
        - name: frontend
          image: social_media_analysis-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: insightsphere-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  selector:
    app: insightsphere-frontend
